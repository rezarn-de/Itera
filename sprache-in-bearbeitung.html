<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprachversion in Bearbeitung | ITERAS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          ellipse at top right,
          #cbe7f5,
          transparent 65%
        ),
        #f9f9fa;
      color: #003441;
      font-family: "IBM Plex Sans", sans-serif;
    }

    main {
      width: 100%;
      max-width: 660px;
      padding-block: 48px;
    }

    .logo {
      display: inline-block;
      margin-bottom: 64px;
      color: #0f4c5c;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: .22em;
      text-decoration: none;
    }

    .status {
      margin: 0 0 20px;
      color: #48626e;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 60px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.035em;
    }

    .description {
      max-width: 520px;
      margin: 24px 0 32px;
      color: #52616a;
      font-size: 18px;
      line-height: 1.7;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 999px;
      background: #0f4c5c;
      color: #fff;
      font-weight: 500;
      text-decoration: none;
    }

    .back-link:hover {
      background: #003441;
    }

    a:focus-visible {
      outline: 3px solid #19839e;
      outline-offset: 5px;
    }
  </style>
<link rel="stylesheet" href="assets/css/brand.css">  
</head>

<body>
  <main>
    <a class="brand-link" href="index.html">
      <img src="assets/images/brand/iteras_logo.png"
          alt="ITERAS – Startseite"
          class="brand-logo">
    </a>

    <p id="language-status" class="status">In Bearbeitung</p>

    <h1 id="language-title">
      Diese Sprachversion entsteht gerade.
    </h1>

    <p id="language-description" class="description">
      Wir arbeiten an der Übersetzung. Bis dahin können Sie
      ITERAS auf Deutsch nutzen.
    </p>

    <a id="language-back" class="back-link" href="index.html">
      <span aria-hidden="true">←</span>
      <span id="language-back-label">Zur deutschen Version</span>
    </a>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const language = params.get('lang');

      const translations = {
        en: {
          status: 'English · Coming soon',
          title: 'We’re working on this version.',
          description:
            'Our English translation is in progress. ' +
            'In the meantime, you can continue using ITERAS in German.',
          back: 'Back to the German version',
          pageTitle: 'English version coming soon | ITERAS'
        },
        es: {
          status: 'Español · Próximamente',
          title: 'Estamos preparando esta versión.',
          description:
            'Estamos trabajando en la traducción al español. ' +
            'Mientras tanto, puede seguir utilizando ITERAS en alemán.',
          back: 'Volver a la versión en alemán',
          pageTitle: 'Versión en español próximamente | ITERAS'
        }
      };

      const content = translations[language];

      if (content) {
        document.documentElement.lang = language;
        document.title = content.pageTitle;
        document.getElementById('language-status').textContent =
          content.status;
        document.getElementById('language-title').textContent =
          content.title;
        document.getElementById('language-description').textContent =
          content.description;
        document.getElementById('language-back-label').textContent =
          content.back;
      }

      // Only allow a local HTML filename and an optional section anchor.
      const requestedBack = params.get('back') || '';
      const validBack =
        /^[a-zA-Z0-9_-]+\.html(?:#[a-zA-Z0-9_-]+)?$/.test(requestedBack);

      document.getElementById('language-back').href =
        validBack ? requestedBack : 'index.html';
    })();
  </script>
</body>
</html>
